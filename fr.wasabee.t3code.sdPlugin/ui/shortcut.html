<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Shortcut</title>
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Command">
    <sdpi-select setting="command" placeholder="Choose a command">
      <option value="thread.previous">Sujet précédent</option>
      <option value="thread.next">Sujet suivant</option>
      <option value="chat.new">Nouveau sujet</option>
      <option value="terminal.toggle">Terminal</option>
      <option value="preview.toggle">Navigateur (aperçu)</option>
      <option value="diff.toggle">Diff</option>
      <option value="usage.open">Ouvrir les usages</option>
      <option value="modelPicker.toggle">Choix du modèle</option>
      <option value="commandPalette.toggle">Palette de commandes</option>
      <option value="thread.steerQueuedMessage">Envoyer le message en file</option>
      <option value="editor.openFavorite">Ouvrir dans l'éditeur favori</option>
      <option value="sidebar.toggle">Barre latérale</option>
      <option value="thread.settle">Clore le sujet</option>
      <option value="thread.pin">Épingler le sujet</option>
      <option value="usage.cost">Usages : vue coût</option>
      <option value="usage.tokens">Usages : vue tokens</option>
      <option value="usage.limits">Usages : vue limites</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-details heading="Connection" open>
    <sdpi-item label="Token">
      <sdpi-password global setting="token"></sdpi-password>
    </sdpi-item>
    <sdpi-item label="Server URL">
      <sdpi-textfield global setting="serverUrl" placeholder="auto"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="App bundle ID">
      <sdpi-textfield global setting="appBundleId" placeholder="com.t3tools.t3code"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Help">
      <details>
        <summary>How to get a token</summary>
        <p>Run <code>t3 auth session issue --token-only --scope orchestration:read --scope orchestration:operate --scope diagnostics:read</code> and paste the output. Leave the server URL empty to auto-discover the local server.</p>
      </details>
    </sdpi-item>
  </sdpi-details>
</body>
</html>
